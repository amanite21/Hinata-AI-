name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Hinata ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Hinata ZIP found."
            exit 1
          fi

          rm -rf hinata-project
          mkdir -p hinata-project

          unzip -q "$ZIP_FILE" -d hinata-project

          echo "ZIP extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find hinata-project -type f -name "AndroidManifest.xml" \
            -path "*/app/src/main/AndroidManifest.xml" \
            -print -quit | xargs -r dirname | xargs -r dirname | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ] || [ ! -d "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Fix Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Fixing Android resources..."

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # --------------------------------------------------
          # Fix missing launcher icon resources
          # --------------------------------------------------

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0B0F19"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M54,12A42,42 0,1 0,54 96A42,42 0,1 0,54 12" />
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M38,45A6,6 0,1 0,38 57A6,6 0,1 0,38 45M70,45A6,6 0,1 0,70 57A6,6 0,1 0,70 45M38,68Q54,80 70,68Q54,88 38,68" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # Fallback launcher icons for older Android versions
          cat > app/src/main/res/mipmap-mdpi/ic_launcher.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_background"/>
              <item android:drawable="@drawable/ic_launcher_foreground"/>
          </layer-list>
          EOF

          cp app/src/main/res/mipmap-mdpi/ic_launcher.xml \
             app/src/main/res/mipmap-mdpi/ic_launcher_round.xml

          # --------------------------------------------------
          # Fix voice interaction XML
          # --------------------------------------------------

          if [ -f app/src/main/res/xml/voice_interaction_service.xml ]; then
            sed -i \
              's/android:recognitionService="com.hinata.assistant.HinataRecognitionService"//' \
              app/src/main/res/xml/voice_interaction_service.xml
          fi

          # --------------------------------------------------
          # Fix repository conflict
          # --------------------------------------------------

          cat > build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HinataAI"

          include ':app'
          EOF

          # --------------------------------------------------
          # Fix Java/Kotlin target
          # --------------------------------------------------

          sed -i \
            's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/' \
            app/build.gradle || true

          sed -i \
            's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/' \
            app/build.gradle || true

          sed -i \
            "s/jvmTarget = '1.8'/jvmTarget = '17'/" \
            app/build.gradle || true

          echo "Android project prepared."

      - name: Validate resources
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Checking required resources..."

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/xml/voice_interaction_service.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "Resource validation passed."

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Clean project
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$ANDROID_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-Debug-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
