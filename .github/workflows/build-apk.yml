name: Build Hinata APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found."
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Project extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT:"
          echo "$ANDROID_DIR"

      - name: Repair root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          printf '%s\n' \
            'buildscript {' \
            "    ext.kotlin_version = '1.9.22'" \
            '' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '' \
            '    dependencies {' \
            "        classpath 'com.android.tools.build:gradle:8.2.2'" \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            '' \
            "tasks.register('clean', Delete) {" \
            '    delete rootProject.layout.buildDirectory' \
            '}' \
            > "$BUILD_FILE"

      - name: Repair AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com\.hinata\.assistant"//g' "$MANIFEST"
          fi

      - name: Repair voice XML
        shell: bash
        run: |
          set -e

          XML="$ANDROID_DIR/app/src/main/res/xml/voice_interaction_service.xml"

          if [ -f "$XML" ]; then
            sed -i \
              's/android:supportsLaunchFromKeyguard="[^"]*"//g' \
              "$XML"
          fi

      - name: Repair voice service
        shell: bash
        run: |
          set -e

          SERVICE=$(find "$ANDROID_DIR/app/src/main/java" \
            -type f \
            -name "HinataVoiceInteractionService.kt" \
            -print -quit)

          if [ -n "$SERVICE" ]; then

            printf '%s\n' \
              'package com.hinata.assistant' \
              '' \
              'import android.service.voice.VoiceInteractionService' \
              '' \
              'class HinataVoiceInteractionService : VoiceInteractionService()' \
              > "$SERVICE"

            echo "Voice service repaired."

          else
            echo "Voice service not found."
          fi

      - name: Repair MainActivity imports
        shell: bash
        run: |
          set -e

          MAIN=$(find "$ANDROID_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = text.splitlines()

          package_line = None
          body = []

          for line in lines:
              if line.startswith("package "):
                  package_line = line
              elif line.strip() == "import org.json.JSONObject":
                  pass
              else:
                  body.append(line)

          if package_line is None:
              raise SystemExit("ERROR: package declaration not found")

          imports = []
          rest = []

          collecting = True

          for line in body:
              if collecting and line.startswith("import "):
                  imports.append(line)
              else:
                  collecting = False
                  rest.append(line)

          if "import org.json.JSONObject" not in imports:
              imports.append("import org.json.JSONObject")

          output = []
          output.append(package_line)
          output.append("")
          output.extend(imports)
          output.append("")
          output.extend(rest)

          path.write_text("\n".join(output) + "\n")
          PY

          echo "MainActivity imports repaired."

          echo "First lines:"
          head -30 "$MAIN"

      - name: Remove invalid hotword references
        shell: bash
        run: |
          set -e

          echo "Searching Kotlin sources..."

          grep -RIl \
            "AlwaysOnHotwordDetector" \
            "$ANDROID_DIR/app/src/main/java" \
            2>/dev/null || true

      - name: Create launcher resources
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:shape="rectangle">' \
            '    <solid android:color="#101018"/>' \
            '    <corners android:radius="20dp"/>' \
            '</shape>' \
            > "$RES/mipmap-mdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-mdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.xml"

          echo "Launcher resources ready."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check environment
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Validate project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle tasks --no-daemon --stacktrace

      - name: Clean project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon --stacktrace

      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HINATA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error

      - name: Success
        run: |
          echo "======================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "======================================"
