name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 3. Android command-line tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Accept Android SDK licenses automatically
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || true

          echo "SDK license step completed."

      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Locate ZIP
      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # 7. Extract ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."

          find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print

      # 8. Find actual Gradle project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Extracted structure:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f | head -300

            exit 1
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # 9. Show project
      - name: Show project structure
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "$ANDROID_DIR"

          echo ""
          echo "Gradle files:"

          find "$ANDROID_DIR" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            -print

      # 10. Setup Gradle 8.11.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 11. Tool versions
      - name: Show tool versions
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      # 12. Validate project
      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle tasks --no-daemon

      # 13. Clean
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      # 14. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 15. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"

      # 16. Upload APK
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error

      # 17. Success
      - name: Build successful
        run: |
          echo "======================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: Hinata-debug.apk"
