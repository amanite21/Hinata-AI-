name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 21
      # ==================================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==================================================
      # 4. ACCEPT LICENSES
      # ==================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "Android SDK licenses accepted."


      # ==================================================
      # 5. INSTALL SDK
      # ==================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==================================================
      # 6. FIND ZIP
      # ==================================================
      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android ZIP found."
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 7. EXTRACT ZIP
      # ==================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted."


      # ==================================================
      # 8. FIND GRADLE PROJECT
      # ==================================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 9. REMOVE PROBLEMATIC allprojects BLOCK
      # ==================================================
      - name: Fix root build.gradle repositories
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          echo "=========================================="
          echo "FIXING ROOT BUILD.GRADLE"
          echo "=========================================="

          if [ ! -f "$BUILD_FILE" ]; then
            echo "Root build.gradle not found."

            if [ -f "$ANDROID_DIR/build.gradle.kts" ]; then
              echo "Found build.gradle.kts instead."
            fi

            exit 0
          fi

          echo ""
          echo "BEFORE:"
          echo "------------------------------------------"
          cat "$BUILD_FILE"
          echo "------------------------------------------"

          # ------------------------------------------------
          # Remove the complete:
          #
          # allprojects {
          #     repositories {
          #         google()
          #         mavenCentral()
          #     }
          # }
          #
          # block.
          #
          # This uses AWK brace counting instead of regex,
          # so nested braces are handled safely.
          # ------------------------------------------------

          awk '
          BEGIN {
              skip = 0
              depth = 0
          }

          {
              if (skip == 0 && $0 ~ /^[[:space:]]*allprojects[[:space:]]*\{/) {
                  skip = 1
                  depth = 0
              }

              if (skip == 1) {

                  open = gsub(/\{/, "{")
                  close = gsub(/\}/, "}")

                  depth += open
                  depth -= close

                  if (depth <= 0) {
                      skip = 0
                  }

                  next
              }

              print
          }
          ' "$BUILD_FILE" > "$BUILD_FILE.tmp"

          mv "$BUILD_FILE.tmp" "$BUILD_FILE"

          echo ""
          echo "AFTER:"
          echo "------------------------------------------"
          cat "$BUILD_FILE"
          echo "------------------------------------------"


      # ==================================================
      # 10. VERIFY NO allprojects REPOSITORY BLOCK
      # ==================================================
      - name: Verify Gradle repository fix
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          echo "Checking root build.gradle..."

          if grep -n "allprojects" "$BUILD_FILE"; then
            echo ""
            echo "WARNING: allprojects still exists."
            echo "Checking repositories..."
          else
            echo ""
            echo "SUCCESS: allprojects block removed."
          fi

          echo ""
          echo "Current repository-related lines:"

          grep -n \
            -E "repositories|google\(\)|mavenCentral\(\)" \
            "$BUILD_FILE" || true


      # ==================================================
      # 11. SETUP GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==================================================
      # 12. TOOL VERSIONS
      # ==================================================
      - name: Show tool versions
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"


      # ==================================================
      # 13. VALIDATE
      # ==================================================
      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING GRADLE"
          echo "=========================================="

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 14. CLEAN
      # ==================================================
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "Cleaning project..."

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 15. BUILD APK
      # ==================================================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING HINATA APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD COMMAND FINISHED."


      # ==================================================
      # 16. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build outputs:"

            find "$ANDROID_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Hinata-debug.apk"


      # ==================================================
      # 17. UPLOAD APK
      # ==================================================
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error


      # ==================================================
      # 18. SUCCESS
      # ==================================================
      - name: Build successful
        run: |
          echo ""
          echo "=========================================="
          echo "       HINATA APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Artifact: Hinata-debug-APK"
          echo ""
