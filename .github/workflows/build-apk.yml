name: Build Hinata APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found."
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "ZIP extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT:"
          echo "$ANDROID_DIR"

      - name: Fix root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          printf '%s\n' \
            'buildscript {' \
            "    ext.kotlin_version = '1.9.22'" \
            '' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '' \
            '    dependencies {' \
            "        classpath 'com.android.tools.build:gradle:8.2.2'" \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            '' \
            "tasks.register('clean', Delete) {" \
            '    delete rootProject.layout.buildDirectory' \
            '}' \
            > "$BUILD_FILE"

      - name: Fix AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com\.hinata\.assistant"//g' "$MANIFEST"
          fi

      - name: Fix voice interaction XML
        shell: bash
        run: |
          set -e

          VOICE_XML="$ANDROID_DIR/app/src/main/res/xml/voice_interaction_service.xml"

          if [ -f "$VOICE_XML" ]; then
            sed -i 's/android:supportsLaunchFromKeyguard="[^"]*"//g' "$VOICE_XML"
          fi

      - name: Fix voice interaction Kotlin service
        shell: bash
        run: |
          set -e

          SERVICE="$ANDROID_DIR/app/src/main/java/com/hinata/assistant/HinataVoiceInteractionService.kt"

          if [ -f "$SERVICE" ]; then

            echo "Replacing unsupported hotword implementation..."

            printf '%s\n' \
              'package com.hinata.assistant' \
              '' \
              'import android.service.voice.VoiceInteractionService' \
              '' \
              '/**' \
              ' * Minimal Android-compatible voice interaction service.' \
              ' * Hotword detection is intentionally disabled here because' \
              ' * AlwaysOnHotwordDetector is not available to normal apps.' \
              ' */' \
              'class HinataVoiceInteractionService : VoiceInteractionService()' \
              > "$SERVICE"

            echo "Voice interaction service fixed."

          else

            echo "Voice interaction service file not found."

          fi

      - name: Add JSONObject import
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find "$ANDROID_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.kt not found."
            exit 1
          fi

          if ! grep -q "import org.json.JSONObject" "$MAIN_ACTIVITY"; then

            TMP_FILE="${MAIN_ACTIVITY}.tmp"

            {
              echo "import org.json.JSONObject"
              cat "$MAIN_ACTIVITY"
            } > "$TMP_FILE"

            mv "$TMP_FILE" "$MAIN_ACTIVITY"

          fi

          echo "JSONObject import checked."

      - name: Create launcher icons
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:shape="rectangle">' \
            '    <solid android:color="#101018"/>' \
            '    <corners android:radius="20dp"/>' \
            '</shape>' \
            > "$RES/mipmap-mdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-mdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.xml"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle tasks --no-daemon --stacktrace

      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HINATA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"

      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error

      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "======================================"
