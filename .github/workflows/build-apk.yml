name: Build Hinata APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found."
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ZIP FOUND"
          echo "$ZIP_FILE"
          echo "======================================"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Android project extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 7 \
              -type f | head -300

            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "$ANDROID_DIR"
          echo "======================================"

      - name: Fix root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          printf '%s\n' \
            'buildscript {' \
            "    ext.kotlin_version = '1.9.22'" \
            '' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '' \
            '    dependencies {' \
            "        classpath 'com.android.tools.build:gradle:8.2.2'" \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            '' \
            "tasks.register('clean', Delete) {" \
            '    delete rootProject.layout.buildDirectory' \
            '}' \
            > "$BUILD_FILE"

          echo "Root build.gradle fixed."

      - name: Fix AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com\.hinata\.assistant"//g' "$MANIFEST"
          fi

          echo "AndroidManifest fixed."

      - name: Fix voice interaction XML
        shell: bash
        run: |
          set -e

          VOICE_XML="$ANDROID_DIR/app/src/main/res/xml/voice_interaction_service.xml"

          echo "======================================"
          echo "CHECKING VOICE INTERACTION XML"
          echo "======================================"

          if [ -f "$VOICE_XML" ]; then

            echo "Found:"
            echo "$VOICE_XML"

            echo ""
            echo "Removing unsupported Android attribute..."

            sed -i 's/android:supportsLaunchFromKeyguard="[^"]*"//g' "$VOICE_XML"

            echo ""
            echo "Fixed voice_interaction_service.xml:"
            cat "$VOICE_XML"

          else

            echo "voice_interaction_service.xml not found."
            echo "Continuing..."

          fi

      - name: Fix all unsupported voice attributes
        shell: bash
        run: |
          set -e

          RES_XML="$ANDROID_DIR/app/src/main/res/xml"

          if [ -d "$RES_XML" ]; then

            find "$RES_XML" \
              -type f \
              -name "*.xml" \
              -print0 | while IFS= read -r -d '' FILE
            do

              sed -i \
                's/android:supportsLaunchFromKeyguard="[^"]*"//g' \
                "$FILE"

            done

          fi

          echo "Unsupported voice attributes cleaned."

      - name: Create launcher icons
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:shape="rectangle">' \
            '    <solid android:color="#101018"/>' \
            '    <corners android:radius="20dp"/>' \
            '</shape>' \
            > "$RES/mipmap-mdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-mdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.xml"

          echo "Launcher icons created."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Java and Gradle
        shell: bash
        run: |
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace

      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HINATA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo "BUILD COMMAND FINISHED"
          echo "======================================"

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK search:"
            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND"
          echo "$APK"
          echo "======================================"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"

      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error

      - name: Build successful
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Go to Actions > Artifacts"
          echo "and download Hinata-debug-APK."
