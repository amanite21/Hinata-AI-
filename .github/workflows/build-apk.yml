name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Android project
        id: android-project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="./android"
          elif [ -f "./hinata-final/android/gradlew" ]; then
            PROJECT_DIR="./hinata-final/android"
          elif [ -f "./hinata-final/gradlew" ]; then
            PROJECT_DIR="./hinata-final"
          else
            GRADLE_FILE=$(find . -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

            if [ -n "$GRADLE_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project structure
        shell: bash
        run: |
          set -e

          cd "${{ steps.android-project.outputs.project_dir }}"

          echo "===== PROJECT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort | head -300

          echo "===== GRADLE FILES ====="
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make Gradle executable
        shell: bash
        run: |
          cd "${{ steps.android-project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "${{ steps.android-project.outputs.project_dir }}"

          echo "===== settings.gradle ====="
          if [ -f "settings.gradle.kts" ]; then
            cat settings.gradle.kts
          elif [ -f "settings.gradle" ]; then
            cat settings.gradle
          fi

          echo "===== root build.gradle ====="
          if [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          elif [ -f "build.gradle" ]; then
            cat build.gradle
          fi

      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "${{ steps.android-project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.android-project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.android-project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "${{ steps.android-project.outputs.project_dir }}" \
              -type f \
              -path "*/build/outputs/*" \
              | sort || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
