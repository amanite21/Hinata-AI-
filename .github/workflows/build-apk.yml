name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # JAVA 21
      # ==============================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==============================
      # ACCEPT LICENSES
      # ==============================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "Android SDK licenses accepted."


      # ==============================
      # INSTALL SDK
      # ==============================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==============================
      # FIND ZIP
      # ==============================
      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==============================
      # EXTRACT ZIP
      # ==============================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."


      # ==============================
      # FIND ANDROID PROJECT
      # ==============================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f | head -300

            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==============================
      # FIX ROOT BUILD.GRADLE
      # ==============================
      - name: Fix root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          echo "=========================================="
          echo "FIXING ROOT BUILD.GRADLE"
          echo "=========================================="

          if [ ! -f "$BUILD_FILE" ]; then
            echo "Root build.gradle not found."

            if [ -f "$ANDROID_DIR/build.gradle.kts" ]; then
              echo "build.gradle.kts exists."
            fi

            exit 0
          fi

          echo ""
          echo "BEFORE:"
          echo "------------------------------------------"
          cat "$BUILD_FILE"
          echo "------------------------------------------"

          # Remove only the allprojects { ... } block.
          # Keep buildscript repositories untouched.

          sed -i \
            '/^[[:space:]]*allprojects[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/d' \
            "$BUILD_FILE"

          echo ""
          echo "AFTER:"
          echo "------------------------------------------"
          cat "$BUILD_FILE"
          echo "------------------------------------------"

          if grep -q "allprojects" "$BUILD_FILE"; then
            echo ""
            echo "ERROR: allprojects block still exists."
            exit 1
          fi

          echo ""
          echo "SUCCESS: allprojects block removed."


      # ==============================
      # SETUP GRADLE
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==============================
      # SHOW VERSIONS
      # ==============================
      - name: Show versions
        shell: bash
        run: |
          echo "================ JAVA ================"
          java -version

          echo ""
          echo "=============== GRADLE ==============="
          gradle --version

          echo ""
          echo "============= ANDROID SDK ============="
          echo "$ANDROID_SDK_ROOT"


      # ==============================
      # VALIDATE
      # ==============================
      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING GRADLE PROJECT"
          echo "=========================================="

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==============================
      # CLEAN
      # ==============================
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING PROJECT"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==============================
      # BUILD APK
      # ==============================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING HINATA APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "APK BUILD COMPLETED."


      # ==============================
      # FIND APK
      # ==============================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"
            find "$ANDROID_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Hinata-debug.apk"


      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error


      # ==============================
      # SUCCESS
      # ==============================
      - name: Build successful
        run: |
          echo ""
          echo "=========================================="
          echo "     HINATA APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Artifact: Hinata-debug-APK"
          echo ""
