name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Android SDK
      # IMPORTANT:
      # Do NOT manually chmod sdkmanager.
      # Do NOT manually install command-line tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      # 4. Find Android project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle Android project..."

          ANDROID_DIR=$(find . \
            -type f \
            -name "settings.gradle*" \
            -not -path "./.git/*" \
            -print \
            -quit \
            | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # 5. Show project structure
      - name: Show project structure
        shell: bash
        run: |
          set -e

          echo "Android directory:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Project files:"
          find "$ANDROID_DIR" -maxdepth 3 -type f \
            | sort \
            | head -300

      # 6. Check Java / Android / Gradle
      - name: Show tool versions
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "===== SDKMANAGER ====="
          command -v sdkmanager || true
          sdkmanager --version || true

          echo ""
          echo "===== AAPT2 ====="
          command -v aapt2 || true

      # 7. Prepare Gradle
      - name: Setup Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

            echo "Gradle wrapper version:"
            ./gradlew --version

          else
            echo "No Gradle wrapper found."

            echo "Gradle files:"
            ls -la

            echo "Using system Gradle."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "ERROR: Gradle wrapper and system Gradle are both missing."
              exit 1
            fi

            gradle --version
          fi

      # 8. Validate Gradle project
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Validating Android Gradle project..."

          if [ -f "./gradlew" ]; then
            ./gradlew tasks --no-daemon
          else
            gradle tasks --no-daemon
          fi

      # 9. Clean
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # 10. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "================================"
          echo "BUILDING HINATA APK"
          echo "================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 12. Upload APK
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # 13. Final success
      - name: Build successful
        shell: bash
        run: |
          echo "================================"
          echo "✅ HINATA APK BUILD SUCCESSFUL"
          echo "================================"
          echo "APK: $APK_PATH"
