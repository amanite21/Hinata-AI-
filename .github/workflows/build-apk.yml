name: Build Hinata APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 4. ACCEPT LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true


      # ==========================================
      # 5. INSTALL SDK
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ==========================================
      # 6. FIND ZIP
      # ==========================================
      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found."
            exit 1
          fi

          echo "=========================================="
          echo "ANDROID ZIP FOUND"
          echo "=========================================="
          echo "$ZIP_FILE"

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. EXTRACT ZIP
      # ==========================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "=========================================="
          echo "ZIP EXTRACTED"
          echo "=========================================="


      # ==========================================
      # 8. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            echo ""
            echo "Files inside extracted project:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 7 \
              -type f | head -300

            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 9. FIX ROOT BUILD.GRADLE
      # ==========================================
      - name: Fix root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          printf '%s\n' \
            'buildscript {' \
            "    ext.kotlin_version = '1.9.22'" \
            '' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '' \
            '    dependencies {' \
            "        classpath 'com.android.tools.build:gradle:8.2.2'" \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            '' \
            "tasks.register('clean', Delete) {" \
            '    delete rootProject.layout.buildDirectory' \
            '}' \
            > "$BUILD_FILE"

          echo "=========================================="
          echo "ROOT BUILD.GRADLE FIXED"
          echo "=========================================="

          cat "$BUILD_FILE"


      # ==========================================
      # 10. FIX ANDROID MANIFEST
      # ==========================================
      - name: Fix AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          sed -i 's/package="com\.hinata\.assistant"//g' "$MANIFEST"

          echo "=========================================="
          echo "ANDROID MANIFEST FIXED"
          echo "=========================================="

          cat "$MANIFEST"


      # ==========================================
      # 11. CREATE LAUNCHER ICONS
      # ==========================================
      - name: Fix launcher icons
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/app/src/main/res"

          echo "=========================================="
          echo "CREATING LAUNCHER ICONS"
          echo "=========================================="

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:shape="rectangle">' \
            '    <solid android:color="#101018"/>' \
            '    <corners android:radius="20dp"/>' \
            '</shape>' \
            > "$RES/mipmap-mdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-mdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.xml"

          echo "Launcher icons created successfully."


      # ==========================================
      # 12. SHOW IMPORTANT PROJECT FILES
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          echo ""
          echo "Project:"
          echo "$ANDROID_DIR"

          echo ""
          echo "settings.gradle:"
          find "$ANDROID_DIR" \
            -maxdepth 1 \
            -type f \
            -name "settings.gradle*" \
            -print

          echo ""
          echo "App directory:"
          ls -la "$ANDROID_DIR/app" || true

          echo ""
          echo "Manifest:"
          ls -la "$ANDROID_DIR/app/src/main/AndroidManifest.xml"


      # ==========================================
      # 13. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ==========================================
      # 14. CHECK JAVA + GRADLE
      # ==========================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ==========================================
      # 15. VALIDATE GRADLE
      # ==========================================
      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING GRADLE PROJECT"
          echo "=========================================="

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 16. CLEAN
      # ==========================================
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING PROJECT"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 17. BUILD APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING HINATA APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "GRADLE BUILD FINISHED"
          echo "=========================================="


      # ==========================================
      # 18. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            
            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
             "$GITHUB_WORKSPACE/Hinata-debug.apk"

          echo ""
          echo "APK copied successfully."


      # ==========================================
      # 19. UPLOAD APK
      # ==========================================
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error


      # ==========================================
      # 20. SUCCESS
      # ==========================================
      - name: Build successful
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       HINATA APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "APK is available in:"
          echo "Actions → Artifacts → Hinata-debug-APK"
