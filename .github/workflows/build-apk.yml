name: Build Hinata APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hinata APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 21
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ==========================================
      # FIND ZIP
      # ==========================================

      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found."
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID ZIP FOUND"
          echo "======================================"
          echo "$ZIP_FILE"


      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Android project extracted."


      # ==========================================
      # FIND ANDROID PROJECT
      # ==========================================

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 7 \
              -type f | head -300

            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          echo "$ANDROID_DIR"


      # ==========================================
      # REPAIR ROOT GRADLE
      # ==========================================

      - name: Repair root build.gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE="$ANDROID_DIR/build.gradle"

          printf '%s\n' \
            'buildscript {' \
            "    ext.kotlin_version = '1.9.22'" \
            '' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '' \
            '    dependencies {' \
            "        classpath 'com.android.tools.build:gradle:8.2.2'" \
            '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"' \
            '    }' \
            '}' \
            '' \
            "tasks.register('clean', Delete) {" \
            '    delete rootProject.layout.buildDirectory' \
            '}' \
            > "$BUILD_FILE"

          echo "Root build.gradle repaired."


      # ==========================================
      # MANIFEST
      # ==========================================

      - name: Repair AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            sed -i \
              's/package="com\.hinata\.assistant"//g' \
              "$MANIFEST"

          fi

          echo "AndroidManifest repaired."


      # ==========================================
      # VOICE XML
      # ==========================================

      - name: Repair voice interaction XML
        shell: bash
        run: |
          set -e

          VOICE_XML="$ANDROID_DIR/app/src/main/res/xml/voice_interaction_service.xml"

          if [ -f "$VOICE_XML" ]; then

            sed -i \
              's/android:supportsLaunchFromKeyguard="[^"]*"//g' \
              "$VOICE_XML"

            echo "Voice XML repaired."

          else

            echo "Voice XML not found."

          fi


      # ==========================================
      # VOICE SERVICE
      # ==========================================

      - name: Repair voice interaction service
        shell: bash
        run: |
          set -e

          SERVICE=$(find "$ANDROID_DIR/app/src/main/java" \
            -type f \
            -name "HinataVoiceInteractionService.kt" \
            -print -quit)

          if [ -n "$SERVICE" ]; then

            printf '%s\n' \
              'package com.hinata.assistant' \
              '' \
              'import android.service.voice.VoiceInteractionService' \
              '' \
              'class HinataVoiceInteractionService : VoiceInteractionService()' \
              > "$SERVICE"

            echo "Voice interaction service repaired."

          else

            echo "Voice interaction service not found."

          fi


      # ==========================================
      # MAIN ACTIVITY IMPORT REPAIR
      # ==========================================

      - name: Repair MainActivity imports
        shell: bash
        run: |
          set -e

          MAIN=$(find "$ANDROID_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = text.splitlines()

          package_line = None
          other_lines = []

          for line in lines:
              if line.startswith("package "):
                  package_line = line
              elif line.strip() == "import org.json.JSONObject":
                  continue
              else:
                  other_lines.append(line)

          if package_line is None:
              raise SystemExit("ERROR: package declaration not found")

          imports = []
          rest = []
          reading_imports = True

          for line in other_lines:

              if reading_imports and line.startswith("import "):
                  imports.append(line)

              else:
                  reading_imports = False
                  rest.append(line)

          if "import org.json.JSONObject" not in imports:
              imports.append("import org.json.JSONObject")

          output = []

          output.append(package_line)
          output.append("")
          output.extend(imports)
          output.append("")
          output.extend(rest)

          path.write_text("\n".join(output) + "\n")

          print("MainActivity imports repaired.")
          PY


      # ==========================================
      # LAUNCHER ICONS
      # ==========================================

      - name: Create launcher resources
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:shape="rectangle">' \
            '    <solid android:color="#101018"/>' \
            '    <corners android:radius="20dp"/>' \
            '</shape>' \
            > "$RES/mipmap-mdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-mdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-hdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher.xml"

          cp "$RES/mipmap-mdpi/ic_launcher.xml" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.xml"

          echo "Launcher resources created."


      # ==========================================
      # GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ==========================================
      # ENVIRONMENT
      # ==========================================

      - name: Check Java and Gradle
        shell: bash
        run: |
          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========= GRADLE ========="
          gradle --version


      # ==========================================
      # VALIDATE
      # ==========================================

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==========================================
      # CLEAN
      # ==========================================

      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HINATA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK BUILD FINISHED."


      # ==========================================
      # FIND APK
      # ==========================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"


      # ==========================================
      # DETECT PACKAGE NAME
      # ==========================================

      - name: Detect APK package name
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/Hinata-debug.apk"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -f "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          PACKAGE=$("$AAPT" dump badging "$APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Could not detect APK package name."
            exit 1
          fi

          echo "APP_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APK PACKAGE"
          echo "$PACKAGE"
          echo "======================================"


      # ==========================================
      # UPLOAD APK BEFORE EMULATOR TEST
      # ==========================================

      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error


      # ==========================================
      # EMULATOR CRASH TEST
      # ==========================================

      - name: Test APK on Android Emulator
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set +e

            echo "======================================"
            echo "INSTALLING HINATA APK"
            echo "======================================"

            adb wait-for-device

            adb install -r "$GITHUB_WORKSPACE/Hinata-debug.apk"

            INSTALL_RESULT=$?

            echo "Install result: $INSTALL_RESULT"

            if [ "$INSTALL_RESULT" -ne 0 ]; then
              echo "APK INSTALL FAILED"

              adb logcat -d > "$GITHUB_WORKSPACE/install-failure-log.txt"

              exit 0
            fi

            echo "APK installed successfully."


            echo "======================================"
            echo "CLEARING LOGCAT"
            echo "======================================"

            adb logcat -c


            echo "======================================"
            echo "LAUNCHING HINATA"
            echo "======================================"

            adb shell monkey \
              -p "$APP_PACKAGE" \
              -c android.intent.category.LAUNCHER \
              1

            LAUNCH_RESULT=$?

            echo "Launch result: $LAUNCH_RESULT"


            echo "======================================"
            echo "WAITING FOR APP"
            echo "======================================"

            sleep 12


            echo "======================================"
            echo "COLLECTING LOGCAT"
            echo "======================================"

            adb logcat -d \
              > "$GITHUB_WORKSPACE/hinata-logcat.txt"


            echo "======================================"
            echo "CRASH LOG"
            echo "======================================"

            grep -E \
              "FATAL EXCEPTION|AndroidRuntime|Process:|Caused by:|Hinata" \
              "$GITHUB_WORKSPACE/hinata-logcat.txt" \
              | tail -250 || true


            echo "======================================"
            echo "CHECKING APPLICATION"
            echo "======================================"

            adb shell pidof "$APP_PACKAGE" || true


            echo "======================================"
            echo "EMULATOR TEST FINISHED"
            echo "======================================"

            exit 0


      # ==========================================
      # UPLOAD CRASH LOG
      # ==========================================

      - name: Upload emulator crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-crash-log
          path: |
            hinata-logcat.txt
            install-failure-log.txt
          if-no-files-found: warn


      # ==========================================
      # ANALYZE CRASH
      # ==========================================

      - name: Analyze launch result
        shell: bash
        run: |
          set +e

          LOG="hinata-logcat.txt"

          if [ ! -f "$LOG" ]; then
            echo "No emulator log was generated."
            exit 0
          fi

          echo "======================================"
          echo "LAUNCH ANALYSIS"
          echo "======================================"

          if grep -q "FATAL EXCEPTION" "$LOG"; then

            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "HINATA CRASHED DURING STARTUP"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo ""

            grep -A 35 \
              "FATAL EXCEPTION" \
              "$LOG" \
              | head -120

            echo ""
            echo "Full log is available in:"
            echo "Hinata-crash-log"
            echo ""

            exit 1

          elif grep -q "AndroidRuntime" "$LOG"; then

            echo ""
            echo "AndroidRuntime activity detected."
            echo "Check Hinata-crash-log for details."

            exit 1

          else

            echo ""
            echo "======================================"
            echo "NO STARTUP CRASH DETECTED"
            echo "======================================"
            echo ""

          fi


      # ==========================================
      # SUCCESS
      # ==========================================

      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "HINATA APK BUILD + STARTUP TEST PASSED"
          echo "======================================"
          echo ""
          echo "Download:"
          echo "Hinata-debug-APK"
          echo ""
