name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. JAVA 21
      # =====================================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # =====================================================
      # 3. ANDROID SDK
      # =====================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =====================================================
      # 4. ACCEPT SDK LICENSES
      # =====================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1 || true

          echo "Android SDK licenses accepted."


      # =====================================================
      # 5. INSTALL ANDROID SDK
      # =====================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."


      # =====================================================
      # 6. FIND ZIP
      # =====================================================
      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # =====================================================
      # 7. EXTRACT ZIP
      # =====================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."

          echo ""
          echo "Searching for Gradle project..."

          find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print


      # =====================================================
      # 8. FIND ANDROID PROJECT
      # =====================================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f | head -300

            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # =====================================================
      # 9. FIX REPOSITORY MODE
      # =====================================================
      - name: Fix Gradle repository configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FIXING GRADLE REPOSITORY CONFIG"
          echo "======================================"

          SETTINGS_GRADLE="$ANDROID_DIR/settings.gradle"
          SETTINGS_KTS="$ANDROID_DIR/settings.gradle.kts"

          # -----------------------------------------------
          # Groovy settings.gradle
          # -----------------------------------------------

          if [ -f "$SETTINGS_GRADLE" ]; then

            echo "Found settings.gradle"

            echo ""
            echo "Before:"
            cat "$SETTINGS_GRADLE"

            # Change PREFER_SETTINGS to PREFER_PROJECT
            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              "$SETTINGS_GRADLE"

            echo ""
            echo "After:"
            cat "$SETTINGS_GRADLE"

          fi


          # -----------------------------------------------
          # Kotlin settings.gradle.kts
          # -----------------------------------------------

          if [ -f "$SETTINGS_KTS" ]; then

            echo "Found settings.gradle.kts"

            echo ""
            echo "Before:"
            cat "$SETTINGS_KTS"

            # Change PREFER_SETTINGS to PREFER_PROJECT
            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              "$SETTINGS_KTS"

            echo ""
            echo "After:"
            cat "$SETTINGS_KTS"

          fi


          echo ""
          echo "Repository configuration fixed."


      # =====================================================
      # 10. SHOW BUILD FILE
      # =====================================================
      - name: Show Gradle files
        shell: bash
        run: |
          echo "======================================"
          echo "ROOT BUILD FILE"
          echo "======================================"

          if [ -f "$ANDROID_DIR/build.gradle" ]; then
            cat "$ANDROID_DIR/build.gradle"
          fi

          if [ -f "$ANDROID_DIR/build.gradle.kts" ]; then
            cat "$ANDROID_DIR/build.gradle.kts"
          fi


      # =====================================================
      # 11. SETUP GRADLE
      # =====================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # =====================================================
      # 12. SHOW VERSIONS
      # =====================================================
      - name: Show tool versions
        shell: bash
        run: |
          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "GRADLE"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "$ANDROID_SDK_ROOT"


      # =====================================================
      # 13. VALIDATE GRADLE
      # =====================================================
      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "Validating Gradle project..."

          gradle tasks \
            --no-daemon \
            --stacktrace


      # =====================================================
      # 14. CLEAN
      # =====================================================
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # =====================================================
      # 15. BUILD APK
      # =====================================================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HINATA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK build completed."


      # =====================================================
      # 16. FIND APK
      # =====================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            find "$ANDROID_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"


      # =====================================================
      # 17. UPLOAD APK
      # =====================================================
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error


      # =====================================================
      # 18. SUCCESS
      # =====================================================
      - name: Build successful
        run: |
          echo ""
          echo "======================================"
          echo " HINATA APK BUILD SUCCESSFUL 🚀"
          echo "======================================"
          echo ""
          echo "Download artifact:"
          echo "Hinata-debug-APK"
