name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Hinata ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Hinata ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p hinata-project
          unzip -q "$ZIP_FILE" -d hinata-project

          echo "Extracted project:"
          find hinata-project -maxdepth 2 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Android APK
        working-directory: hinata-project/android
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find hinata-project/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-Debug-APK
          path: hinata-project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
