name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Java 21
      # -----------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | head -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # -----------------------------
      # Gradle
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # -----------------------------
      # Find ZIP
      # -----------------------------
      - name: Find Hinata ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname "*.zip" \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Hinata ZIP not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------
      # Extract ZIP
      # -----------------------------
      - name: Extract Hinata project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/hinata-extracted"
          mkdir -p "$GITHUB_WORKSPACE/hinata-extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/hinata-extracted"

          echo "Extraction completed."

      # -----------------------------
      # Locate Android project
      # -----------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/hinata-extracted"

          PROJECT_DIR=""

          SETTINGS_FILE="$(find "$ROOT" -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE="$(find "$ROOT" \
              -type f \
              -name "gradlew" \
              -print -quit)"

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            APP_GRADLE="$(find "$ROOT" \
              -type f \
              \( -path "*/app/build.gradle" \
              -o -path "*/app/build.gradle.kts" \) \
              -print -quit)"

            if [ -n "$APP_GRADLE" ]; then
              PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Extracted structure:"
            find "$ROOT" -maxdepth 8 -print | sort
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # -----------------------------
      # Show project
      # -----------------------------
      - name: Show project structure
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          pwd

          echo "----------------------------"
          find . -maxdepth 4 -type f | sort | head -300

      # -----------------------------
      # Clean
      # -----------------------------
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      # -----------------------------
      # Find APK
      # -----------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$ANDROID_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not generated."
            find "$ANDROID_PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      # -----------------------------
      # Final
      # -----------------------------
      - name: Build successful
        run: |
          echo "================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "================================"
