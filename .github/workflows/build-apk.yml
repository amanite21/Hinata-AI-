name: Build Hinata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 21
      # IMPORTANT: Gradle cache yahan intentionally disabled hai
      # because Android project ZIP ke andar hai.
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      # 4. Find and extract Android project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      # 5. Locate Android Gradle project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Searching extracted structure:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # 6. Show project structure
      - name: Show project structure
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          echo "$ANDROID_DIR"

          echo ""
          echo "Files:"
          find "$ANDROID_DIR" -maxdepth 3 -type f | sort | head -300

      # 7. Setup Gradle
      # The project may not contain a valid Gradle wrapper,
      # so use Gradle 8.11.1 directly.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 8. Show versions
      - name: Show tool versions
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      # 9. Validate Gradle project
      - name: Validate Gradle project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          gradle tasks --no-daemon

      # 10. Clean
      - name: Clean Android project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          gradle clean --no-daemon

      # 11. Build Debug APK
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      # 12. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Hinata-debug.apk"

      # 13. Upload APK
      - name: Upload Hinata APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinata-debug-APK
          path: Hinata-debug.apk
          if-no-files-found: error

      # 14. Success
      - name: Build successful
        run: |
          echo "======================================"
          echo "HINATA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: Hinata-debug.apk"
